name: value_capture
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Scientific stack
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - tqdm
  - joblib
  # Notebooks
  - jupyterlab
  - ipykernel
  - ipywidgets
  - pingouin
  # Neuroimaging
  - nibabel
  - nilearn
  # Bayesian modeling (PyMC5 + Bambi + HSSM)
  - pymc
  - bambi
  - arviz
  - pip:
    - jax[cuda12]     # required by hssm's numpyro sampler + braincoder (Keras backend)
    - absl-py         # transitive hssm dep (jaxonnxruntime)
    - hssm            # Hierarchical Sequential Sampling Models (DDM etc.)
    - pybids          # BIDS dataset access
    - pyarrow         # fast parquet/csv I/O
    - pyyaml          # reading experiment settings/logs
    - git+https://github.com/cvnlab/GLMsingle.git
    # braincoder installed separately from libs/braincoder/ by setup_env.sh
    - -e ../           # install value_capture package itself (editable)
