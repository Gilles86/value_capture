name: value_capture
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Scientific stack
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - jupyterlab
  - ipykernel
  - ipywidgets
  # Neuroimaging
  - nibabel
  - nilearn
  - pip:
    - pingouin
    - pyyaml
    - pyarrow
    - tqdm
    - pybids
    - git+https://github.com/cvnlab/GLMsingle.git
    # braincoder installed separately from libs/braincoder/ by setup_env.sh
    - -e .
